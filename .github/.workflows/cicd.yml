name: Sprint boot CI/CD pipeline

on:
push:
  branches: 
   - main
pull request:
  branches:
   - main
workflow_dispatch:
 
jobs:
 build:
  runs-on: ubuntu-latest 
  #runs-on: self-hosted
  steps:
   -name: checkout code
    uses: actions/checkout@v2

   -name: set up JDK 11
    uses: actions/setup-java@v2
    with:
    distribution: 'adopt'
     java-version: '17'
  
   -name: unit test
    run : mvn test
   